<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Habita · Tu próximo hogar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/estilos.css">
</head>

<body>
    <header class="barra-navegacion navbar d-flex flex-wrap gap-3"><a class="marca" href="/">▦ habita<span>CONDOMINIOS</span></a>
        <nav class="flex-wrap" aria-label="Navegación principal"><a class="btn boton-navegacion" href="/">Explorar</a><a class="btn boton-navegacion" href="/panel" th:if="${sesionIniciada}"
                th:text="${esAdministrador ? 'Administración' : 'Mi espacio'}">Mi espacio</a><a class="btn boton-navegacion" href="/iniciar-sesion"
                th:unless="${sesionIniciada}">Iniciar sesión</a></nav>
    </header>
    <main class="container-fluid">
        <section class="contenedor-formulario card shadow-sm">
            <p class="antetitulo">TU NUEVO HOGAR</p>
            <h1 th:text="${condominio.nombre}"></h1>
            <p th:text="${condominio.ubicacion}"></p>
            <h2 th:text="${'$' + condominio.precio + ' MXN / mes'}"></h2>
            <p>El alquiler quedará asociado al nombre, correo y teléfono de tu cuenta. Al confirmar recibirás un folio
                personal de identificación para presentarlo al entrar o salir.</p>
            <p class="aviso error alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p>
            <form th:action="@{/alquilar/{id}(id=${condominio.id})}" method="post"><label class="form-label">Fecha de inicio<input
                        type="date" name="fechaInicio" th:min="${hoy}" th:value="${hoy}" required></label>
                <p class="atenuado">Este registro no realiza un cobro en línea.</p><button class="btn btn-primary">Confirmar alquiler →</button>
            </form>
        </section>
    </main>
    <footer><span class="marca">habita</span>
        <form th:if="${sesionIniciada}" th:action="@{/cerrar-sesion}" method="post"><button class="btn btn-primary"
                type="submit">Cerrar sesión</button></form>
    </footer>
</body>

</html>
