<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Habita · Tu próximo hogar</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="/estilos.css">
    <link rel="stylesheet" href="/estilos-login.css">
</head>

<body>
    <header class="barra-navegacion navbar d-flex flex-wrap gap-3"><a class="marca" href="/">▦ habita<span>CONDOMINIOS</span></a>
        <nav class="flex-wrap" aria-label="Navegación principal"><a class="btn boton-navegacion" href="/">Explorar</a><a class="btn boton-navegacion" href="/panel" th:if="${sesionIniciada}"
                th:text="${esAdministrador ? 'Administración' : 'Mi espacio'}">Mi espacio</a><a class="btn boton-navegacion" href="/iniciar-sesion"
                th:unless="${sesionIniciada}">Iniciar sesión</a></nav>
    </header>
    <main class="container-fluid">
        <section class="contenedor-formulario card shadow-sm">
            <p class="antetitulo">BIENVENIDO A CASA</p>
            <h1>Tu espacio, a un clic.</h1>
            <p>Inicia sesión para gestionar tu condominio.</p>
            <p class="aviso error alert alert-danger" role="alert" th:if="${param.error}">Correo o contraseña incorrectos.</p>
            <p class="aviso alert alert-success" role="status" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</p>
            <form th:action="@{/iniciar-sesion}" method="post"><label class="form-label">Correo electrónico<input class="form-control" type="email"
                        name="correo" autocomplete="username" required></label><label class="form-label">Contraseña<input class="form-control" type="password"
                        name="contrasena" autocomplete="current-password" required></label><button class="btn btn-primary">Iniciar sesión
                    →</button></form>
            <p>¿Aún no tienes cuenta? <a href="/registro">Regístrate aquí</a></p>
        </section>
    </main>
    <footer><span class="marca">habita</span>
        <form th:if="${sesionIniciada}" th:action="@{/cerrar-sesion}" method="post"><button class="btn btn-primary"
                type="submit">Cerrar sesión</button></form>
    </footer>
</body>

</html>
